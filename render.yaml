# Optional Render Blueprint for the Balancil API + Postgres.
# Prefer the README dashboard steps if blueprint fields differ on your plan.
# Never commit real APP_KEY, mail passwords, or .env files.

databases:
  - name: balancil-db
    plan: free
    databaseName: balancil
    user: balancil

services:
  - type: web
    name: balancil-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force --no-interaction
    envVars:
      - key: APP_NAME
        value: Balancil
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: balancil-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: noreply@balancil.app
      - key: MAIL_FROM_NAME
        value: Balancil
      - key: SKIP_MIGRATE
        value: "1"
